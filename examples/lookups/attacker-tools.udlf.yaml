# yaml-language-server: $schema=https://detectionflow.com/schemas/udlf/lookup/v0.1.0.json
#
# A file-backed matching set. The 'description' column is carried so an alert can
# say *why* a tool is on the list; what a deployer does with non-key columns is
# unmodelled in v0.1.0.
id: 9f4c1a77-2b6e-4d08-8f31-c5a70e2d4b19
name: attacker_tools
title: Known attacker tool names

description: >-
  Executable names of tools routinely abused during intrusions — credential
  dumpers, tunnelling utilities and remote-access software. Matched against
  process names. Reviewed quarterly; additions need a reference in the changelog.

metadata:
  created_at: "2026-07-31"
  version: "1.0.0"
  authors:
    - Detection Engineering Team

key: attacker_tool_names
match:
  type: exact
  case_sensitive: false

columns:
  - name: attacker_tool_names
    description: Executable name as it appears on disk.
  - name: description
    description: What the tool is used for, surfaced in the alert message.

data:
  format: csv
  file: attacker-tools.csv

references:
  - https://lolbas-project.github.io/

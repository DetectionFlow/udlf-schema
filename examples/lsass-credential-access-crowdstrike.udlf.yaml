# yaml-language-server: $schema=https://detectionflow.com/schemas/udlf/v0.3.1.json
#
# Showcase: a CrowdStrike-native detection. One CQL (CrowdStrike Query Language)
# variant deployed to Falcon as a correlation rule. Exercises the
# crowdstrike v0.2.0 config: lower-case `trigger`/`outcome`, a Go-style
# schedule (`1h0m` / `24h0m`), and severity as UDLF's word that the deployer
# translates to Falcon's numeric scale. Whether it alerts is read from
# `details.outcome` — `detection` reaches an analyst.
id: b7c8d9e0-f1a2-4b3c-8d4e-5f6a7b8c9d0e
title: LSASS Credential Access via Suspicious Process
lifecycle: live

metadata:
  created_at: "2026-08-25"
  version: "1.0.0"
  authors:
    - Detection Engineering Team

detection_context:
  severity: high
  description: |
    Detects a process opening a handle to lsass.exe with access rights that permit
    memory reads, a common precursor to credential dumping.
  false_positives: |
    Endpoint security agents and backup tooling that legitimately read process
    memory, and approved red-team tooling in a sanctioned window.
  implementation_guidance: |
    Requires Falcon endpoint telemetry for process-handle (ProcessRollup/handle)
    events. No additional data onboarding beyond the Falcon sensor.
  investigation_guidance: |
    Review the accessing process lineage and code-signing status, and confirm
    whether the granted access mask includes VM_READ (0x0010) or ALL_ACCESS.
  attack_procedures: |
    # Open lsass with read rights and dump its memory:
    procdump.exe -accepteula -ma lsass.exe out.dmp
  references:
    - https://attack.mitre.org/techniques/T1003/001/

threat:
  attack_version: "19"
  attack:
    - technique: T1003.001
      tactics:
        - Credential Access
  custom_tags:
    domain: endpoint
    analytic_story:
      - Credential Dumping

# A single CQL variant. The deployer ships it verbatim as the correlation rule's
# query; `crowdstrike` selects this variant.
detection_content:
  - language: cql
    description: Falcon NG-SIEM / LogScale correlation query
    logic: |
      #event_simpleName=ProcessRollup2
      | TargetProcessName=/\\lsass\.exe$/i
      | GrantedAccess=/0x1010|0x1410|0x1438|0x143a|0x1fffff/i
      | groupBy([aid, ComputerName, SourceProcessName], function=count())
      | count > 0

tests:
  - name: True positive - handle to lsass with read access
    framework: synthetic
    log:
      event_simpleName: ProcessRollup2
      TargetProcessName: C:\Windows\System32\lsass.exe
      GrantedAccess: "0x1438"
      SourceProcessName: C:\Tools\procdump.exe
    expected: hit
  - name: Benign - EDR agent reading process memory must not fire
    framework: synthetic
    log:
      event_simpleName: ProcessRollup2
      TargetProcessName: C:\Windows\System32\lsass.exe
      GrantedAccess: "0x1000"
      SourceProcessName: C:\Program Files\CrowdStrike\CSFalconService.exe
    expected: miss

deployments:
  - name: falcon-prod
    platform: crowdstrike            # discriminator: selects the cql variant + scopes config
    lifecycle: live
    # Free-form to the UDLF core schema; optionally checked against
    # schemas/udlf/config/crowdstrike/v0.2.0.json as a separate, explicit pass.
    config:
      schema: crowdstrike::0.2.0
      severity: high                 # UDLF word; the deployer maps it to Falcon 70
      details:
        name: "LSASS credential access on $ComputerName$"
        outcome: detection           # `detection` reaches an analyst; `event` would only record
        trigger: summary             # one outcome for all matches in a run
        tactic: TA0006               # Credential Access (ATT&CK)
        technique: T1003.001         # OS Credential Dumping: LSASS Memory
      schedule:
        frequency: "1h0m"            # Go-style duration; minimum 5m
        lookback: "24h0m"            # maximum 168h

changelog:
  - date: "2026-08-25"
    version: "1.0.0"
    author: Detection Engineering Team
    summary: Initial CQL LSASS credential-access detection with a Falcon correlation-rule deployment.

# yaml-language-server: $schema=https://detectionflow.com/schemas/udlf/v0.2.0
id: 7b2c1d3e-4f5a-6b7c-8d9e-0f1a2b3c4d5e
title: Suspicious Scheduled Task Creation via Schtasks.exe
lifecycle: live

metadata:
  created_at: "2024-06-01"
  version: "1.0.0"
  authors:
    - Detection Engineering Team

detection_context:
  severity: medium
  description: |
    Detects suspicious scheduled task creation which may indicate
    persistence mechanisms being established by threat actors.

threat:
  attack_version: "19"
  attack:
    - technique: T1053.005
      tactics:
        - Persistence

# language: sigma embeds a native Sigma rule object directly in `logic`.
# It is validated against the pinned SigmaHQ detection-rule schema.
detection_content:
  - language: sigma
    logic:
      title: Scheduled Task Creation Via Schtasks.EXE
      id: 92626ddd-662c-49e3-ac59-f6535f12d189
      status: test
      description: Detects the creation of scheduled tasks by user accounts via the "schtasks" utility.
      references:
        - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/schtasks-create
      author: Florian Roth (Nextron Systems)
      date: 2019-01-16
      modified: 2025-10-22
      tags:
        - attack.execution
        - attack.persistence
        - attack.privilege-escalation
        - attack.t1053.005
        - attack.s0111
        - car.2013-08-001
        - stp.1u
      logsource:
        category: process_creation
        product: windows
      detection:
        selection:
          Image|endswith: '\schtasks.exe'
          CommandLine|contains: ' /create '
        filter_main_system_user:
          User|contains:
            - 'AUTHORI'
            - 'AUTORI'
        filter_optional_msoffice:
          ParentImage:
            - 'C:\Program Files\Microsoft Office\root\integration\integrator.exe'
            - 'C:\Program Files (x86)\Microsoft Office\root\integration\integrator.exe'
          Image:
            - 'C:\Windows\System32\schtasks.exe'
            - 'C:\Windows\SysWOW64\schtasks.exe'
          CommandLine|contains: 'Microsoft\Office\Office Performance Monitor'
        condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
      falsepositives:
        - Administrative activity
        - Software installation
      level: low

# Provenance to the upstream Sigma rule is a typed link, not metadata.source_url.
# target is a default-branch permalink; license + modification carry the redistribution
# obligations (attribution link, changed-file notice) that this copy inherits.
links:
  - type: derived_from
    source_format: sigma
    target: https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_schtasks_creation.yml
    source_id: 92626ddd-662c-49e3-ac59-f6535f12d189
    source_version: "2025-10-22"
    license: https://github.com/SigmaHQ/Detection-Rule-License
    modification: Translated from Sigma YAML into UDLF v0.2.0; detection logic unchanged.

deployments:
  - name: sentinel-prod
    platform: sentinel
    mode: alert
    lifecycle: live

changelog:
  - date: "2024-06-01"
    version: "1.0.0"
    author: Detection Engineering Team
    summary: Wrapped the upstream SigmaHQ schtasks-creation Sigma rule in UDLF for sentinel-prod.
  - date: "2024-12-15"
    version: "1.0.0"
    author: Detection Engineering Team
    summary: Refreshed the embedded Sigma rule to the upstream 2025-10-22 revision.

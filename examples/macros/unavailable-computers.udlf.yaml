# yaml-language-server: $schema=https://detectionflow.com/schemas/udlf/macro/v0.1.0.json
#
# A KQL macro. Sentinel deploys this as a savedSearches resource whose
# functionAlias is 'name'; 'type' is required on every argument because
# functionParameters declares a typed signature ('argSpan: timespan') and the
# function cannot be created without it.
id: 4b1d8c2e-7a3f-4e51-9c06-2f8d5a91b7e4
name: unavailable_computers
title: Computers with no recent heartbeat

description: >-
  Returns computers whose last heartbeat is older than the supplied timespan.
  Shared by the availability and tamper-detection analytics so both agree on
  what "unavailable" means.

metadata:
  created_at: "2026-07-31"
  version: "1.0.0"
  authors:
    - Detection Engineering Team

language: kql
arguments:
  - name: argSpan
    type: timespan

definition: >-
  Heartbeat | summarize LastHeartbeat=max(TimeGenerated) by Computer
  | where LastHeartbeat < ago(argSpan)

references:
  - https://learn.microsoft.com/en-us/azure/azure-monitor/logs/functions

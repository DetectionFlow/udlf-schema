# yaml-language-server: $schema=https://detectionflow.com/schemas/udlf/macro/v0.1.0.json
#
# A CQL macro. LogScale deploys this as a saved query, invoked as
# $"killed_process"(signal="SIGKILL"). Parameters are untyped, so 'type' is
# forbidden; defaults map to the ?{name=default} form, which LogScale honours in
# saved searches but ignores in the UI and dashboards.
id: e7a2f309-5b64-4c8d-a1f2-63d09b4e5210
name: killed_process
title: Processes terminated by signal

description: >-
  Filters process-exit events down to those terminated by a given signal,
  defaulting to any signal. Used as the leading stage of the process-tampering
  detections so the signal vocabulary is defined in one place.

metadata:
  created_at: "2026-07-31"
  version: "1.0.0"
  authors:
    - Detection Engineering Team

language: cql
arguments:
  - name: signal
    default: "*"

definition: '?{signal="*"} | #event_simpleName = ProcessTerminated | signal = ?signal'

references:
  - https://library.humio.com/data-analysis/syntax-fields-user-input.html
